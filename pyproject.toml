[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "robust_safe_rl"
version = "0.1.0"
description = "Residual-RL quadrotor control with OOD-gated residuals on SE(3)"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "numpy",
    "torch",
    "matplotlib",
]

[tool.setuptools.packages.find]
where = ["src"]
